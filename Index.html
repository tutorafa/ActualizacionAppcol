<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva versión de Appcol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #ED1C24; --red-light: rgba(237,28,36,0.08); --red-mid: rgba(237,28,36,0.18); }

    html, body {
      height: 100%; width: 100%; background: #f2f2f2;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow', sans-serif;
    }

    .card {
      background: #fff; border: 3px solid var(--red); border-radius: 10px;
      width: min(88vw, 420px); padding: 48px 36px;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      box-shadow: 0 0 0 6px var(--red-light), 0 8px 32px rgba(237,28,36,0.12), 0 2px 8px rgba(0,0,0,0.06);
      animation: fadeIn 0.5s ease both;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .icon-wrap {
      width: 80px; height: 80px; border-radius: 18px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .icon-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }

    .label-nueva {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--red); background: var(--red-light); border: 1px solid var(--red-mid);
      padding: 4px 12px; border-radius: 100px;
    }

    .divider { width:100%; height:1px; background: linear-gradient(to right, transparent, var(--red-mid), transparent); }

    .title {
      font-size: 18px; font-weight: 700; color: #1a1a1a;
      text-align: center; line-height: 1.35;
    }

    .body-text {
      font-size: 15px; font-weight: 400; color: #333;
      text-align: center; line-height: 1.65;
    }

    .sub {
      font-size: 13px; font-weight: 400; color: #666;
      text-align: center; line-height: 1.6;
    }

    /* Botón play principal */
    .btn-play {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--red);
      border: none; outline: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(237,28,36,0.40);
      transition: transform .12s, box-shadow .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-play:active { transform: scale(.92); box-shadow: 0 2px 10px rgba(237,28,36,0.30); }
    .btn-play svg { width: 28px; height: 28px; margin-left: 4px; }

    /* Overlay modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
      z-index: 100;
    }
    .overlay.visible { opacity: 1; pointer-events: all; }

    .modal {
      background: #fff; border: 3px solid var(--red); border-radius: 14px;
      width: min(80vw, 300px); padding: 36px 28px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      transform: scale(.92) translateY(10px);
      transition: transform .22s ease;
    }
    .overlay.visible .modal { transform: scale(1) translateY(0); }

    .modal-text {
      font-size: 15px; font-weight: 400; color: #1a1a1a;
      text-align: center; line-height: 1.6;
      cursor: pointer;
      text-decoration: none;
      display: block;
      width: 100%;
      padding: 8px 0;
    }
    .modal-text:hover { color: var(--red); }
  </style>
</head>
